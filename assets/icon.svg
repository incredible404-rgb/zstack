<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="zstack icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131920"/>
      <stop offset="100%" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#334155" stroke-width="3"/>
  <!-- Stacked layers forming a subtle Z + layered architecture -->
  <path d="M32 36 H96 L78 54 H32 Z" fill="url(#accent)"/>
  <path d="M40 58 H92 L84 70 H32 Z" fill="#94a3b8" opacity="0.88"/>
  <path d="M50 74 H96 V92 H32 Z" fill="#f8fafc"/>
  <!-- Verification pulse dot -->
  <circle cx="96" cy="36" r="6" fill="#34d399" stroke="#131920" stroke-width="2.5"/>
</svg>
